[package]
name = "sql-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast terminal workbench for SQL Server and Oracle"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
futures-util = "0.3.34"
oracle = "0.6.3"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "rustls"] }
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.1", features = ["rt", "net", "time"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
toml = "0.9.12"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = "symbols"

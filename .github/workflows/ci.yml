name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # No SQL Server, no Oracle and no Instant Client here: the integration
      # tests return early unless SQL_BENCH_TEST_DBS is set, so what runs on
      # CI is everything that does not need a database.
      - run: cargo test --all-targets
      - run: cargo build --release

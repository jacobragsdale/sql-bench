name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # No SQL Server, no Oracle and no Instant Client here: the integration
      # tests return early unless SQL_BENCH_TEST_DBS is set, so what runs on
      # CI is everything that does not need a database.
      - run: cargo test --all-targets
      # The replay smoke test: the real loop on a TestBackend, no terminal and
      # no database, which is how rule 3 is kept honest on a runner.
      - run: SQL_BENCH_CONFIG=config.local.toml cargo run -- --replay scripts/replay/smoke.keys --size 120x40 --frames-dir /tmp/frames
      # Every QA check that needs no database: the shell at five sizes, a
      # resize mid-run, the quit keys, NO_COLOR, the terminal restored after
      # a panic (which needs `script`, from util-linux) and the draw latency.
      - run: scripts/qa.sh
      - run: cargo build --release

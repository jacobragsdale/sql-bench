# sql-bench reads ~/.config/sql-bench/config.toml, or whatever
# $SQL_BENCH_CONFIG names. Copy this file there and edit it. A missing file
# is not an error — it is a configuration with no connections in it.

[oracle]
# Where the Oracle Instant Client is. Optional: without it the driver looks
# wherever the system linker does. A leading ~ is your home directory.
client_lib_dir = "~/.local/opt/oracle/instantclient_23_26"

# One [[connection]] per database. `name` is unique and is what `--conn`
# and the tab bar show.
[[connection]]
name = "reporting"
kind = "mssql"        # "mssql" or "oracle"
host = "sql01.example.com"
port = 1433           # left out: 1433 for mssql, 1521 for oracle
database = "Reporting"  # mssql only, and required for it
user = "svc_reports"
password_env = "REPORTING_PASSWORD"  # read when the connection is opened
trust_cert = false    # mssql only; true accepts a self-signed certificate
encrypt = true        # mssql only; the default

[[connection]]
name = "ledger"
kind = "oracle"
host = "ora01.example.com"
port = 1521
service = "LEDGER"    # oracle only, and required for it
user = "bench"
# One password source per connection, and only one:
#   password     = "in the file, for a database nobody cares about"
#   password_env = "VARIABLE"          read from the environment
#   password_cmd = "pass show ledger"  run through sh -c, trailing newline dropped
password_cmd = "pass show ledger"
